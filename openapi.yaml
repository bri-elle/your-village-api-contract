openapi: 3.0.3

info:
  title: YourVillage API
  version: 1.0.0
  description: >-
    API contract for YourVillage, drafted directly from the Data Design
    Specification (DDS). Authentication is handled client-side by the
    Supabase Auth SDK — this contract has no auth endpoints. Every
    endpoint derives the calling user from the authenticated session;

servers:
  - url: /api
    description: Next.js API route base

tags:
  - name: Me
  - name: People
  - name: Threads
  - name: Captures
  - name: Suggestions
  - name: Prompts
  - name: Experiments
  - name: AI
  - name: Decision Engine
    description: >-
      Python Decision Engine contract. These operations are documented here so
      App API and DE API appear in one Swagger document; this does not change
      service routing, deployment, or runtime integration.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Decision Engine]
      operationId: getDecisionEngineHealth
      summary: Check Decision Engine service health
      description: Reports whether the Python Decision Engine process is running.
      security: []
      responses:
        '200':
          description: Decision Engine service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionEngineHealth'

  # ----------------------------------------
  # ME (profiles)
  # ----------------------------------------

  /me:
    get:
      tags: [Me]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'

    patch:
      tags: [Me]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelfRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'

  # ----------------------------------------
  # PEOPLE (contacts)
  # ----------------------------------------

  /people:
    get:
      tags: [People]
      summary: List people
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Search by name
        - name: relationshipState
          in: query
          schema:
            $ref: '#/components/schemas/RelationshipState'
          description: >-
            Filter by state. "returning" surfaces reconnection candidates —
            no separate reconnection endpoint exists, it's this filter.
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: List of people
          content:
            application/json:
              schema:
                type: object
                required: [items, activeCount]
                properties:
                  activeCount:
                    type: integer
                    description: Count of contacts in growing/keeping states.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Person'

    post:
      tags: [People]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'

  /people/{id}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [People]
      summary: Get a person
      responses:
        '200':
          description: Person details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [People]
      summary: Update a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [People]
      summary: Delete a person
      description: Cascades to hooks, threads, and nudge state for this person. Unlinks the person from captures via database trigger while retaining captures in user account history.
      responses:
        '204':
          description: Person deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /people/{id}/captures:
    parameters:
      - $ref: '#/components/parameters/PersonId'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
    get:
      tags: [Captures]
      summary: List raw capture history for a person
      description: Audit trail of transcripts/text memos linked to this person.
      responses:
        '200':
          description: Captures linked to this person
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaptureSummary'

  /people/{id}/threads:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    post:
      tags: [Threads]
      summary: Create a thread (commitment/follow-up)
      description: >-
        Covers both AI-extracted commitments and user-set reminders — a
        reminder is a thread with kind "commitment_mine".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenThread'

  /people/{personId}/threads/{threadId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema: { type: string }
      - name: threadId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Threads]
      summary: Update a thread's status
      description: >-
        Resolving a thread (e.g. "did it happen? yes") logs a qualifying
        user-reported interaction. Relationship evidence also includes
        accepted acted suggestions (copy/share via POST /suggestions/{id}/act):
        both sources can drive relationship_state transitions such as
        growing → keeping. Deduplicating when a report describes the same
        interaction as an acted suggestion is a separate reconciliation concern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ThreadStatus'
      responses:
        '200':
          description: Thread updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenThread'

  # ----------------------------------------
  # CAPTURES (raw input pipeline)
  # ----------------------------------------

  /captures/text:
    post:
      tags: [Captures]
      summary: Submit a text memo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTextCaptureRequest'
      responses:
        '202':
          description: Accepted for extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'

  /captures/voice:
    post:
      tags: [Captures]
      summary: Register a voice memo for transcription
      description: >-
        The frontend uploads the audio directly to a private Supabase
        Storage bucket (RLS-scoped to the authenticated user) and submits
        only the resulting path. The API never receives raw audio bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoiceCaptureRequest'
      responses:
        '202':
          description: Accepted for transcription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'

  /captures/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Captures]
      summary: Get capture status, transcript, and extraction result
      responses:
        '200':
          description: Current capture state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Captures]
      summary: Submit reviewed transcript and target contact(s) to trigger extraction
      description: >-
        Called after the user reviews/edits the transcript. Extraction
        runs on this approved text, not the raw transcription output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript, contactIds]
              properties:
                transcript:
                  type: string
                contactIds:
                  type: array
                  items: { type: string }
                  description: >-
                    Existing contact IDs, or omit to let extraction propose
                    a new contact for manual approval.
      responses:
        '202':
          description: Accepted for extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'

  # ----------------------------------------
  # PROMPTS
  # ----------------------------------------

  /prompts/{id}/action:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Prompts]
      summary: Perform an action on a prompt (quick confirmations / management)
      description: >-
        Handles quick confirmations ("Did it happen?" / Yes, No, Reschedule) or
        general prompt actions (accept, reject, snooze, edit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptActionRequest'
      responses:
        '200':
          description: Prompt action applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ----------------------------------------
  # SUGGESTIONS (nudges)
  # ----------------------------------------

  /suggestions:
    get:
      tags: [Suggestions]
      summary: Get today's suggested actions
      responses:
        '200':
          description: Current suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/SuggestedAction'

  /suggestions/{id}/act:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Suggestions]
      summary: Mark a suggestion as acted on (e.g. draft copied/shared)
      description: >-
        Records copy/share as an acted suggestion. The first accepted action
        atomically resolves its linked thread, records one meaningful interaction
        and updates relationship and action-tracking state. The suggestion must
        belong to the caller, be shown, and be within its 24-hour lifetime.
        Repeating an already-acted request succeeds without additional effects or
        timestamp changes. The server assigns the action time; clients do not supply it.
      responses:
        '200':
          description: First action accepted, or an already-acted request repeated; returns SuggestedAction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedAction'
        '400':
          description: Invalid suggestion or user ID.
        '401':
          description: Authentication required.
        '403':
          description: Caller is not permitted to perform the operation.
        '404':
          description: Suggestion or contact unavailable to the caller.
        '409':
          description: >-
            Invalid lifecycle transition, elapsed expiry, inconsistent
            linked-thread ownership, or a concurrency conflict
            (`RETRY_REQUIRED`) so the caller can retry.
        '500':
          description: Unexpected persistence failure; this operation's writes are rolled back.

  /suggestions/{id}/dismiss:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Suggestions]
      summary: Dismiss a suggestion ("Not now")
      responses:
        '204':
          description: Dismissed

  /suggestions/{id}/override:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Suggestions]
      summary: Override the suggested goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal: { type: string }
      responses:
        '204':
          description: Override recorded

  # ----------------------------------------
  # EXPERIMENTS (behavioral layer)
  # ----------------------------------------

  /experiments:
    post:
      tags: [Experiments]
      summary: Log a prediction before a hard reach-out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'

  /experiments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Experiments]
      summary: Log the outcome of a prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'

  # ----------------------------------------
  # AI (stateless utility calls)
  # ----------------------------------------

  /ai/rewrite:
    post:
      tags: [AI]
      summary: Rewrite text (concise / grammar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, mode]
              properties:
                content: { type: string }
                mode: { type: string, enum: [concise, grammar] }
      responses:
        '200':
          description: Rewritten text
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }

  # ----------------------------------------
  # DECISION ENGINE (Python service)
  # Documentation-only merge: runtime routing remains unchanged.
  # ----------------------------------------

  /v1/decisions:
    post:
      tags: [Decision Engine]
      operationId: createDecision
      summary: Create a Decision Engine recommendation
      description: >-
        Accepts the existing snake_case DE input contract, applies interaction
        analysis and deterministic state rules, and returns the exact
        nine-field DE output contract. Database-driven persistence retries once
        on a stale person/thread write conflict; a second conflict returns 409
        with code RETRY_REQUIRED without exposing database diagnostics.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PythonDecisionEngineInput'
      responses:
        '200':
          description: Decision completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PythonDecisionEngineOutput'
        '409':
          $ref: '#/components/responses/DEConflict'
        '422':
          $ref: '#/components/responses/DEValidationError'
        '503':
          $ref: '#/components/responses/DEServiceUnavailable'

  /v1/decisions/feedback:
    post:
      tags: [Decision Engine]
      operationId: createDecisionFeedback
      summary: Apply feedback to a Decision Engine recommendation
      description: >-
        Records skipped, acted, or superseded feedback. Acted feedback uses the
        shared `persist_acted_suggestion` path: it does not re-run interaction
        analysis or use client `at` / feedback text to determine effects;
        already-acted retries return success; invalid lifecycle transitions
        return 409. For acted responses, `state_updates` is an empty array
        because the RPC returns the saved nudge rather than a transition trace —
        an empty array does not mean thread/contact effects were skipped.
        Superseded feedback may re-run interaction analysis. Skipped feedback
        does not update person or open-thread state.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionFeedbackRequest'
      responses:
        '200':
          description: Feedback processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionFeedbackResult'
        '409':
          $ref: '#/components/responses/DEConflict'
        '422':
          $ref: '#/components/responses/DEValidationError'
        '503':
          $ref: '#/components/responses/DEServiceUnavailable'

  /v1/decisions/{input_snapshot_id}/state-updates:
    parameters:
      - name: input_snapshot_id
        in: path
        required: true
        description: ID of a snapshot previously processed by the DE service.
        schema: { type: string }
    get:
      tags: [Decision Engine]
      operationId: getDecisionStateUpdates
      summary: Get state updates for a Decision Engine snapshot
      security: []
      responses:
        '200':
          description: Snapshot candidates and code-owned state updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionStateView'
        '404':
          $ref: '#/components/responses/DENotFound'

  /v1/integrations/supabase/decisions:
    post:
      tags: [Decision Engine]
      operationId: createDecisionFromSupabase
      summary: Create and persist a decision using Supabase data
      description: >-
        Internal server-to-server endpoint. It reads the approved Supabase
        sources, constructs the existing DE input contract, runs the Python
        Decision Engine, and persists the canonical result. On a stale
        person/thread write conflict the service rebuilds context once; a
        second conflict returns 409 with code RETRY_REQUIRED.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupabaseDecisionRequest'
      responses:
        '200':
          description: Decision completed and canonical result persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupabaseDecisionResult'
        '401':
          $ref: '#/components/responses/DEUnauthorized'
        '409':
          $ref: '#/components/responses/DEConflict'
        '422':
          $ref: '#/components/responses/DEValidationError'
        '503':
          $ref: '#/components/responses/DEServiceUnavailable'

  /v1/integrations/supabase/decisions/feedback:
    post:
      tags: [Decision Engine]
      operationId: createDecisionFeedbackFromSupabase
      summary: Apply and persist decision feedback using Supabase data
      description: >-
        Internal server-to-server endpoint. It restores the required decision
        context when necessary, applies the existing feedback rules, and
        persists the canonical feedback and state changes. Acted feedback uses
        the shared `persist_acted_suggestion` path (no model re-analysis; empty
        `state_updates` does not mean effects were skipped; retries succeed;
        invalid transitions return 409).
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupabaseDecisionFeedbackRequest'
      responses:
        '200':
          description: Feedback processed and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionFeedbackResult'
        '401':
          $ref: '#/components/responses/DEUnauthorized'
        '404':
          $ref: '#/components/responses/DENotFound'
        '409':
          $ref: '#/components/responses/DEConflict'
        '422':
          $ref: '#/components/responses/DEValidationError'
        '503':
          $ref: '#/components/responses/DEServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued session access token.
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Server-to-server token configured as DECISION_ENGINE_INTERNAL_TOKEN.

  parameters:
    PersonId:
      name: id
      in: path
      required: true
      schema: { type: string }

    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
      description: Number of items to return.

    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Offset for pagination.

  schemas:
    RelationshipState:
      type: string
      enum: [growing, keeping, returning, archive]

    HookKind:
      type: string
      enum: [durable, routine, context, recent, time_bound]

    ThreadStatus:
      type: string
      enum: [open, attempted, resolved, lapsed]

    ThreadKind:
      type: string
      enum: [plan_shaped, commitment_theirs, commitment_mine, time_bound]

    CaptureProcessingStatus:
      type: string
      enum: [pending_transcription, pending_review, pending_extraction, extracted, failed]

    RelationshipType:
      type: string
      enum: [friend, family, colleague, acquaintance, mentor, peer, partner]

    Person:
      type: object
      required: [id, fullName, relationshipState, hooks, openThreads]
      properties:
        id: { type: string }
        relationshipState:
          $ref: '#/components/schemas/RelationshipState'
        fullName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        isFavorite:
          { type: boolean, description: Favorite flag for contact prioritization/filtering. }
        birthday:
          {
            type: string,
            format: date,
            nullable: true,
            description: Contact birthday (YYYY-MM-DD).,
          }
        memories:
          type: array
          items: { type: string }
          nullable: true
          description: Image gallery URLs for memories.
        relationship: { $ref: '#/components/schemas/RelationshipType', nullable: true }
        whereWeMet: { type: string, nullable: true }
        whenWeMet: { type: string, format: date-time, nullable: true }
        lastInteraction:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Latest recognized interaction timestamp from an accepted acted suggestion or qualifying reported interaction. Must not move an existing later value backwards.,
          }
        context:
          type: object
          additionalProperties: true
          description: Structured JSON containing personal facts (e.g., corgi names, shared memories, location, work, family, availability) for personalized messaging.
        hooks:
          type: array
          items: { $ref: '#/components/schemas/Hook' }
        openThreads:
          type: array
          items: { $ref: '#/components/schemas/OpenThread' }

    Hook:
      type: object
      required: [id, content, kind]
      properties:
        id: { type: string }
        content: { type: string }
        kind: { $ref: '#/components/schemas/HookKind' }
        captureId:
          { type: string, format: uuid, nullable: true, description: Source capture for this fact. }
        lastUsedAt: { type: string, format: date-time, nullable: true }

    OpenThread:
      type: object
      required: [id, content, status, kind]
      properties:
        id: { type: string }
        content: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/ThreadStatus' }
        kind: { $ref: '#/components/schemas/ThreadKind' }
        captureId:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Source capture for this commitment.,
          }

    CreateThreadRequest:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        kind: { $ref: '#/components/schemas/ThreadKind' }

    CreatePersonRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string }
        relationship: { $ref: '#/components/schemas/RelationshipType', nullable: true }
        isFavorite: { type: boolean, nullable: true }
        birthday: { type: string, format: date, nullable: true }
        memories:
          type: array
          items: { type: string }
          nullable: true
          description: Image gallery URLs for memories.
        whereWeMet: { type: string }
        whenWeMet: { type: string, format: date-time }
        lastInteraction:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Timestamp of the last interaction with this contact.,
          }
        context:
          type: object
          additionalProperties: true
          description: Structured JSON containing personal facts (e.g., corgi names, shared memories, location, work, family, availability) for personalized messaging.

    UpdatePersonRequest:
      type: object
      properties:
        relationshipState: { $ref: '#/components/schemas/RelationshipState' }
        fullName: { type: string }
        relationship: { $ref: '#/components/schemas/RelationshipType', nullable: true }
        isFavorite: { type: boolean, nullable: true }
        birthday: { type: string, format: date, nullable: true }
        memories:
          type: array
          items: { type: string }
          nullable: true
          description: Image gallery URLs for memories.
        whereWeMet: { type: string }
        whenWeMet: { type: string, format: date-time }
        lastInteraction:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Timestamp of the last interaction with this contact.,
          }
        context:
          type: object
          additionalProperties: true
          description: Structured JSON containing personal facts (e.g., corgi names, shared memories, location, work, family, availability) for personalized messaging.

    Self:
      type: object
      required: [id, fullName, relationshipGoals, createdAt]
      properties:
        id: { type: string }
        fullName: { type: string }
        age:
          {
            type: integer,
            nullable: true,
            description: Stores the precise age from the User Profile Data.,
          }
        location:
          {
            type: string,
            nullable: true,
            description: Stores the current location from the User Profile Data.,
          }
        notes:
          {
            type: string,
            nullable: true,
            description: Stores general user notes not covered by other fields.,
          }
        occupationIndustry: { type: string, nullable: true }
        interestsHobbies:
          type: array
          items: { type: string }
        socialActivities:
          type: array
          items: { type: string }
        relationshipGoals:
          type: array
          items: { type: string }
          minItems: 1
        commPreferences:
          type: array
          items: { type: string }
        weeklyRoutine: { type: string, nullable: true }
        timezone: { type: string, description: IANA timezone format. }
        createdAt: { type: string, format: date-time }

    UpdateSelfRequest:
      type: object
      properties:
        fullName: { type: string }
        age:
          {
            type: integer,
            nullable: true,
            description: Stores the precise age from the User Profile Data.,
          }
        location:
          {
            type: string,
            nullable: true,
            description: Stores the current location from the User Profile Data.,
          }
        notes:
          {
            type: string,
            nullable: true,
            description: Stores general user notes not covered by other fields.,
          }
        occupationIndustry: { type: string }
        interestsHobbies:
          type: array
          items: { type: string }
        socialActivities:
          type: array
          items: { type: string }
        relationshipGoals:
          type: array
          items: { type: string }
        commPreferences:
          type: array
          items: { type: string }
        weeklyRoutine: { type: string }
        timezone: { type: string, description: IANA timezone format. }

    CreateTextCaptureRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        contactIds:
          type: array
          items: { type: string }
        followUp:
          type: object
          nullable: true
          description: Structured trigger logic (e.g., target date, conditions, status) required for proactive suggestions in Stories 1 and 2.

    CreateVoiceCaptureRequest:
      type: object
      required: [audioStoragePath]
      properties:
        audioStoragePath:
          type: string
          description: 'e.g. "{userId}/{captureId}.webm"'
        contactIds:
          type: array
          items: { type: string }
        followUp:
          type: object
          nullable: true
          description: Structured trigger logic (e.g., target date, conditions, status) required for proactive suggestions in Stories 1 and 2.

    CaptureStatus:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/CaptureProcessingStatus' }

    CaptureSummary:
      type: object
      required: [id, transcript, createdAt]
      properties:
        id: { type: string }
        transcript: { type: string }
        followUp:
          type: object
          nullable: true
          description: Structured trigger logic (e.g., target date, conditions, status) required for proactive suggestions.
        createdAt: { type: string, format: date-time }

    CaptureDetail:
      allOf:
        - $ref: '#/components/schemas/CaptureStatus'
        - type: object
          properties:
            transcript: { type: string, nullable: true }
            extraction:
              $ref: '#/components/schemas/CaptureExtractionOutput'
              nullable: true
            followUp:
              type: object
              nullable: true
              description: >-
                Structured trigger logic (e.g., target date, conditions, status)
                required for reliable execution of proactive suggestions in Stories 1 and 2.
              properties:
                targetDate: { type: string, format: date-time, nullable: true }
                conditions: { type: string, nullable: true }
                status: { type: string, nullable: true }
              additionalProperties: true
            ruminationFeedback: { type: string, nullable: true }

    SuggestedAction:
      type: object
      required: [id, personId, goal, actionType, expiresAt]
      properties:
        id: { type: string }
        personId: { type: string }
        goal: { type: string, enum: [check_in, make_plan] }
        actionType: { type: string, enum: [message, non_message] }
        inputSnapshotId: { type: string, nullable: true }
        draft: { type: string, nullable: true }
        nonMessageAction:
          type: object
          nullable: true
          properties:
            kind: { type: string }
            label: { type: string }
            payload: { type: object }
          additionalProperties: true
        hookRef: { type: string, nullable: true }
        threadRef: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }

    CreateExperimentRequest:
      type: object
      required: [personId, prediction]
      properties:
        personId: { type: string }
        prediction: { type: string }

    Experiment:
      type: object
      required: [id, personId, prediction, createdAt]
      properties:
        id: { type: string }
        personId: { type: string }
        prediction: { type: string }
        outcome: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ExtractedHookEntry:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        kind: { $ref: '#/components/schemas/HookKind' }

    ExtractedThreadEntry:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        kind: { $ref: '#/components/schemas/ThreadKind' }

    Candidate:
      type: object
      required: [personId, displayName, relationshipState, hooks, threads]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        relationshipState: { $ref: '#/components/schemas/RelationshipState' }
        lastInteraction:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Latest recognized interaction timestamp. Powers Story 3 (Returning) and quiet period logic; not a 60-day count.,
          }
        upcomingPlan:
          { type: object, nullable: true, description: Details of a known upcoming plan, if any. }
        latestCapture:
          { type: object, nullable: true, description: Details of recent inbound activity. }
        stalenessHint: { type: string, nullable: true }
        hooks:
          type: array
          items: { $ref: '#/components/schemas/ExtractedHookEntry' }
        threads:
          type: array
          items: { $ref: '#/components/schemas/ExtractedThreadEntry' }
        history:
          type: object
          required: [allowedGoals]
          properties:
            allowedGoals:
              type: array
              items: { type: string, enum: [check_in, make_plan] }
          description: Nudge history summary including allowed_goals.
        nonMessageKind:
          {
            type: string,
            nullable: true,
            description: Advisory field indicating an available or recent non-message action.,
          }

    DecisionEngineInput:
      type: object
      required: [asOf, inputSnapshotId, trigger, user, budget, candidates]
      properties:
        asOf:
          {
            type: string,
            format: date-time,
            description: Frozen Clock. Exact time the snapshot was created.,
          }
        inputSnapshotId:
          { type: string, format: uuid, description: Unique ID for this snapshot version. }
        trigger:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [scheduled, input_triggered] }
            personId: { type: string, format: uuid, nullable: true }
            capturesCompletedAt: { type: string, format: date-time, nullable: true }
          description: Details the trigger.
        user:
          type: object
          required: [timezone]
          properties:
            timezone: { type: string, description: IANA timezone format. }
            routines: { type: object, description: Placeholder for user routines object. }
          description: Contains user preferences.
        budget:
          type: object
          required: [cardsRemaining, pushAvailable]
          properties:
            cardsRemaining: { type: integer }
            pushAvailable: { type: boolean }
          description: Contains cards_remaining and push_available status.
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
          description: Array of eligible contacts.

    DecisionEngineOutput:
      type: object
      required: [decision, inputSnapshotId, rationale]
      properties:
        decision: { type: string, enum: [action, none] }
        inputSnapshotId: { type: string, format: uuid }
        personId: { type: string, format: uuid, nullable: true }
        actionType: { type: string, enum: [message, non_message], nullable: true }
        goal: { type: string, enum: [check_in, make_plan], nullable: true }
        hookRef: { type: string, format: uuid, nullable: true }
        draft: { type: string, nullable: true }
        nonMessageAction:
          {
            type: object,
            nullable: true,
            description: Structured instruction for a non-message action (e.g.,
            get contacts info).,
          }
        rationale: { type: string, description: Trace-only text describing the LLM's reasoning. }

    PythonDecisionCandidate:
      type: object
      required:
        - person_id
        - display_name
        - relationship_state
        - hooks
        - open_threads
      properties:
        person_id: { type: string }
        display_name: { type: string }
        profile:
          $ref: '#/components/schemas/PythonDecisionCandidateProfile'
        relationship_state:
          $ref: '#/components/schemas/RelationshipState'
        state_since: { type: string, format: date-time, nullable: true }
        captured_at: { type: string, format: date-time, nullable: true }
        last_reported_interaction_at: { type: string, format: date-time, nullable: true }
        last_interaction: { type: string, format: date-time, nullable: true }
        reported_interaction_count: { type: integer, minimum: 0, default: 0 }
        upcoming_plan: { type: object, nullable: true, additionalProperties: true }
        inbound: { type: object, nullable: true, additionalProperties: true }
        staleness_hint: { type: string, nullable: true }
        hooks:
          type: array
          items: { $ref: '#/components/schemas/PythonDecisionHook' }
        open_threads:
          type: array
          items: { $ref: '#/components/schemas/PythonDecisionOpenThread' }
        history:
          $ref: '#/components/schemas/PythonDecisionCandidateHistory'
        non_message_kind: { type: string, nullable: true }
        transcript_excerpts:
          type: array
          items: { type: string }

    PythonDecisionCandidateProfile:
      type: object
      properties:
        how_we_met: { type: string, nullable: true }
        logistics: { type: string, nullable: true }
        contact_info_present: { type: boolean, default: true }
        is_favorite:
          type: boolean
          default: false
          description: Contact-prioritization flag supplied by contacts.is_favorite.
        birthday:
          type: string
          format: date-time
          nullable: true
          description: Optional contact birthday supplied by contacts.birthday.
        memories:
          type: array
          items: { type: string, format: uri }
          description: Contact memory-gallery URLs supplied by contacts.memories.

    PythonDecisionHook:
      type: object
      required: [hook_id, text, kind, captured_at]
      properties:
        hook_id: { type: string }
        text: { type: string }
        kind: { type: string }
        captured_at: { type: string, format: date-time }
        used_at: { type: string, format: date-time, nullable: true }

    PythonDecisionOpenThread:
      type: object
      required: [thread_id, text, kind, state, opened_at]
      properties:
        thread_id: { type: string }
        text: { type: string }
        kind: { type: string }
        state: { $ref: '#/components/schemas/ThreadStatus' }
        opened_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time, nullable: true }
        last_attempted_at: { type: string, format: date-time, nullable: true }

    PythonDecisionCandidateHistory:
      type: object
      properties:
        nudges:
          type: array
          items: { type: object, additionalProperties: true }
        omitted:
          type: object
          properties:
            count: { type: integer, minimum: 0 }
            oldest_at: { type: string, format: date-time, nullable: true }
          additionalProperties: true
        last_action_at: { type: string, format: date-time, nullable: true }
        quiet_until: { type: string, format: date-time, nullable: true }
        allowed_goals:
          type: array
          items: { type: string, enum: [check_in, make_plan] }

    PythonDecisionEngineInput:
      type: object
      required: [as_of, input_snapshot_id, trigger, user, budget, candidates]
      properties:
        as_of:
          {
            type: string,
            format: date-time,
            description: Frozen Clock. Exact time the snapshot was created.,
          }
        input_snapshot_id: { type: string, description: Unique ID for this snapshot version. }
        trigger:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [scheduled, input_triggered, manual_request] }
            person_id: { type: string, nullable: true }
            capture_completed_at: { type: string, format: date-time, nullable: true }
          description: Details the trigger.
        user:
          type: object
          required: [timezone]
          properties:
            timezone: { type: string, description: IANA timezone format. }
            routines:
              description: User routines supplied by the App data adapter.
              oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  items: { type: object, additionalProperties: true }
            moved_at: { type: string, format: date, nullable: true }
          additionalProperties: true
          description: Contains user preferences.
        budget:
          type: object
          required: [cards_remaining, push_available]
          properties:
            cards_remaining: { type: integer, minimum: 0, maximum: 3 }
            push_available: { type: boolean }
        user_text_input:
          type: string
          default: ''
          description: Current user text used for interaction analysis.
        candidates:
          type: array
          items: { $ref: '#/components/schemas/PythonDecisionCandidate' }
          description: Array of eligible contacts.

    PythonDecisionEngineOutput:
      type: object
      additionalProperties: false
      required:
        - decision
        - input_snapshot_id
        - person_id
        - action_type
        - goal
        - hook_ref
        - draft
        - non_message_action
        - rationale
      properties:
        decision: { type: string, enum: [action, none] }
        input_snapshot_id: { type: string }
        person_id: { type: string, nullable: true }
        action_type: { type: string, enum: [message, non_message], nullable: true }
        goal: { type: string, enum: [check_in, make_plan], nullable: true }
        hook_ref: { type: string, nullable: true }
        draft: { type: string, nullable: true }
        non_message_action:
          type: object
          nullable: true
          additionalProperties: false
          required: [kind, instruction]
          properties:
            kind: { type: string }
            instruction: { type: string }
        rationale: { type: string, description: Trace-only decision explanation. }

    DecisionEngineHealth:
      type: object
      required: [status, model]
      properties:
        status: { type: string, enum: [ok] }
        model:
          type: string
          description: Gemini model configured for this DE service instance.

    SupabaseDecisionRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: Owner profile ID used to scope all database reads and writes.
        capture_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Extracted capture that triggers an input-triggered decision. Omit
            for scheduled or manual requests.
        trigger_kind:
          type: string
          enum: [scheduled, input_triggered, manual_request]
          nullable: true
          description: >-
            Defaults to input_triggered when capture_id is supplied and to
            scheduled otherwise.
        as_of:
          type: string
          format: date-time
          nullable: true
          description: Optional frozen clock; defaults to the current UTC time.
        cards_remaining:
          type: integer
          minimum: 0
          maximum: 3
          nullable: true
          description: Optional daily card budget; defaults to 3.
        push_available:
          type: boolean
          nullable: true
          description: >-
            Optional push availability; defaults to false for input-triggered
            runs and true otherwise.

    SupabaseDecisionResult:
      type: object
      required:
        - input
        - output
        - interaction_analysis
        - state_updates
        - excluded
        - nudge_id
      properties:
        input:
          $ref: '#/components/schemas/PythonDecisionEngineInput'
        output:
          $ref: '#/components/schemas/PythonDecisionEngineOutput'
        interaction_analysis:
          $ref: '#/components/schemas/InteractionAnalysisResult'
        state_updates:
          type: array
          items: { $ref: '#/components/schemas/DecisionStateUpdate' }
        excluded:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: Candidate IDs mapped to deterministic exclusion reasons.
        nudge_id:
          type: string
          format: uuid
          nullable: true
          description: Persisted nudge ID, or null when no message action was stored.

    InteractionAnalysisResult:
      type: object
      required:
        - person_id
        - real_world
        - reciprocal
        - substantive
        - kind
        - thread_ref
        - thread_transition
        - rationale
      properties:
        person_id: { type: string, nullable: true }
        real_world: { type: boolean }
        reciprocal: { type: boolean }
        substantive: { type: boolean }
        kind: { type: string }
        thread_ref: { type: string, nullable: true }
        thread_transition:
          type: string
          enum: [attempted, resolved, lapsed]
          nullable: true
        rationale: { type: string }

    DecisionFeedbackRequest:
      type: object
      required: [input_snapshot_id, person_id, feedback, at]
      properties:
        input_snapshot_id: { type: string }
        person_id: { type: string }
        nudge_id: { type: string, nullable: true }
        feedback: { type: string, enum: [skipped, acted, superseded] }
        at: { type: string, format: date-time }
        user_text_input:
          type: string
          default: ''
          description: >-
            Interaction text used when acted or superseded feedback is
            reanalyzed. It is ignored for skipped feedback.

    SupabaseDecisionFeedbackRequest:
      allOf:
        - $ref: '#/components/schemas/DecisionFeedbackRequest'
        - type: object
          required: [user_id, nudge_id]
          properties:
            user_id:
              type: string
              format: uuid
              description: Owner profile ID used to authorize database access.
            nudge_id:
              type: string
              format: uuid
              description: Persisted suggestion receiving this feedback.

    DecisionFeedbackResult:
      type: object
      required:
        - input_snapshot_id
        - person_id
        - feedback
        - nudge_id
        - state_updates
        - candidate
      properties:
        input_snapshot_id: { type: string }
        person_id: { type: string }
        feedback: { type: string, enum: [skipped, acted, superseded] }
        nudge_id: { type: string }
        state_updates:
          type: array
          items: { $ref: '#/components/schemas/DecisionStateUpdate' }
          description: >-
            For acted feedback this is always empty because persistence returns
            the saved nudge rather than a transition trace. An empty array does
            not mean relationship or thread effects were skipped.
        candidate:
          $ref: '#/components/schemas/PythonDecisionCandidate'

    DecisionStateView:
      type: object
      required: [input_snapshot_id, state_updates, candidates]
      properties:
        input_snapshot_id: { type: string }
        state_updates:
          type: array
          items: { $ref: '#/components/schemas/DecisionStateUpdate' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/PythonDecisionCandidate' }

    DecisionStateUpdate:
      oneOf:
        - $ref: '#/components/schemas/PersonStateUpdate'
        - $ref: '#/components/schemas/OpenThreadStateUpdate'
      discriminator:
        propertyName: entity
        mapping:
          person: '#/components/schemas/PersonStateUpdate'
          open_thread: '#/components/schemas/OpenThreadStateUpdate'

    PersonStateUpdate:
      type: object
      required:
        - entity
        - person_id
        - previous_state
        - new_state
        - meaningful
        - reported_interaction_count
        - last_reported_interaction_at
        - reason
        - updated_at
      properties:
        entity: { type: string, enum: [person] }
        person_id: { type: string }
        previous_state: { $ref: '#/components/schemas/RelationshipState' }
        new_state: { $ref: '#/components/schemas/RelationshipState' }
        meaningful: { type: boolean }
        reported_interaction_count: { type: integer, minimum: 0 }
        last_reported_interaction_at: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }

    OpenThreadStateUpdate:
      type: object
      required:
        - entity
        - thread_id
        - previous_state
        - new_state
        - reason
        - updated_at
      properties:
        entity: { type: string, enum: [open_thread] }
        thread_id: { type: string }
        previous_state: { $ref: '#/components/schemas/ThreadStatus' }
        new_state: { $ref: '#/components/schemas/ThreadStatus' }
        reason: { type: string }
        updated_at: { type: string, format: date-time }

    DEHTTPError:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    CaptureExtractionOutput:
      type: object
      properties:
        personName: { type: string }
        newHooks:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ExtractedHookEntry' }
        newThreads:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ExtractedThreadEntry' }
        context:
          type: object
          additionalProperties: true
          description: Structured JSON containing personal facts (e.g., corgi names, shared memories, location, work, family, availability) for personalized messaging.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    PromptActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, reject, snooze, edit, yes, no, reschedule]
          description: >-
            Action to perform. Supports technical actions (accept, reject, snooze, edit)
            and quick confirmation labels (yes, no, reschedule).
        editedDraft:
          type: string
          description: Updated draft text when action is edit.
        snoozeDays:
          type: integer
          minimum: 1
          default: 3
          description: Number of days to snooze when action is snooze or reschedule.

    PromptActionResponse:
      type: object
      required: [success, promptId, actionApplied]
      properties:
        success:
          type: boolean
        promptId:
          type: string
        actionApplied:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalServerError:
      description: Unexpected internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DEValidationError:
      description: Decision Engine input validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DEHTTPError' }
    DEConflict:
      description: >-
        Decision Engine concurrency or lifecycle conflict. Body detail may use
        code RETRY_REQUIRED when the caller should retry with fresh context.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DEHTTPError' }
    DENotFound:
      description: Decision Engine snapshot was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DEHTTPError' }
    DEServiceUnavailable:
      description: Decision Engine model or dependency is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DEHTTPError' }
    DEUnauthorized:
      description: Internal Decision Engine integration token is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DEHTTPError' }
