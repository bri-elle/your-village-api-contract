openapi: 3.0.3

info:
  title: YourVillage API
  version: 1.0.0
  description: >-
    API contract for YourVillage, drafted directly from the Data Design
    Specification (DDS). Authentication is handled client-side by the
    Supabase Auth SDK — this contract has no auth endpoints. Every
    endpoint derives the calling user from the authenticated session;

servers:
  - url: https://api.example.com
    description: Production

tags:
  - name: Me
  - name: People
  - name: Threads
  - name: Captures
  - name: Suggestions
  - name: Experiments
  - name: AI

security:
  - bearerAuth: []

paths:

  # ----------------------------------------
  # ME (profiles)
  # ----------------------------------------

  /me:
    get:
      tags: [Me]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'

    patch:
      tags: [Me]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelfRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'

  # ----------------------------------------
  # PEOPLE (contacts)
  # ----------------------------------------

  /people:
    get:
      tags: [People]
      summary: List people
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Search by name
        - name: personState
          in: query
          schema:
            $ref: '#/components/schemas/PersonState'
          description: >-
            Filter by state. "returning" surfaces reconnection candidates —
            no separate reconnection endpoint exists, it's this filter.
      responses:
        '200':
          description: List of people
          content:
            application/json:
              schema:
                type: object
                required: [items, activeCount]
                properties:
                  activeCount:
                    type: integer
                    description: Count of contacts in growing/keeping states.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Person'

    post:
      tags: [People]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'

  /people/{id}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [People]
      summary: Get a person
      responses:
        '200':
          description: Person details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [People]
      summary: Update a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [People]
      summary: Delete a person
      description: Cascades to hooks, threads, nudge state, and captures for this person.
      responses:
        '204':
          description: Person deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /people/{id}/captures:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [Captures]
      summary: List raw capture history for a person
      description: Audit trail of transcripts/text memos linked to this person.
      responses:
        '200':
          description: Captures linked to this person
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaptureSummary'

  /people/{id}/threads:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    post:
      tags: [Threads]
      summary: Create a thread (commitment/follow-up)
      description: >-
        Covers both AI-extracted commitments and user-set reminders — a
        reminder is a thread with kind "commitment_mine".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenThread'

  /people/{personId}/threads/{threadId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema: { type: string }
      - name: threadId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Threads]
      summary: Update a thread's status
      description: >-
        Resolving a thread (e.g. "did it happen? yes") is how a reported
        real-world interaction is logged — this is what should drive
        person_state transitions (growing → keeping), not any in-app
        action like copying a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ThreadStatus'
      responses:
        '200':
          description: Thread updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenThread'

  # ----------------------------------------
  # CAPTURES (raw input pipeline)
  # ----------------------------------------

  /captures/text:
    post:
      tags: [Captures]
      summary: Submit a text memo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTextCaptureRequest'
      responses:
        '202':
          description: Accepted for extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'

  /captures/voice:
    post:
      tags: [Captures]
      summary: Register a voice memo for transcription
      description: >-
        The frontend uploads the audio directly to a private Supabase
        Storage bucket (RLS-scoped to the authenticated user) and submits
        only the resulting path. The API never receives raw audio bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoiceCaptureRequest'
      responses:
        '202':
          description: Accepted for transcription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'

  /captures/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Captures]
      summary: Get capture status, transcript, and extraction result
      responses:
        '200':
          description: Current capture state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Captures]
      summary: Submit reviewed transcript and target contact(s) to trigger extraction
      description: >-
        Called after the user reviews/edits the transcript. Extraction
        runs on this approved text, not the raw transcription output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript, contactIds]
              properties:
                transcript:
                  type: string
                contactIds:
                  type: array
                  items: { type: string }
                  description: >-
                    Existing contact IDs, or omit to let extraction propose
                    a new contact for manual approval.
      responses:
        '202':
          description: Accepted for extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'

  # ----------------------------------------
  # SUGGESTIONS (nudges)
  # ----------------------------------------

  /suggestions:
    get:
      tags: [Suggestions]
      summary: Get today's suggested actions
      responses:
        '200':
          description: Current suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/SuggestedAction'

  /suggestions/{id}/act:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Suggestions]
      summary: Mark a suggestion as acted on (e.g. draft copied/shared)
      description: >-
        Updates nudge status only. Does not by itself change person_state —
        only a resolved thread (reported real-world interaction) does that.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedAction'

  /suggestions/{id}/dismiss:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Suggestions]
      summary: Dismiss a suggestion ("Not now")
      responses:
        '204':
          description: Dismissed

  /suggestions/{id}/override:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Suggestions]
      summary: Override the suggested goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal: { type: string }
      responses:
        '204':
          description: Override recorded

  # ----------------------------------------
  # EXPERIMENTS (behavioral layer)
  # ----------------------------------------

  /experiments:
    post:
      tags: [Experiments]
      summary: Log a prediction before a hard reach-out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'

  /experiments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Experiments]
      summary: Log the outcome of a prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'

  # ----------------------------------------
  # AI (stateless utility calls)
  # ----------------------------------------

  /ai/rewrite:
    post:
      tags: [AI]
      summary: Rewrite text (concise / grammar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, mode]
              properties:
                content: { type: string }
                mode: { type: string, enum: [concise, grammar] }
      responses:
        '200':
          description: Rewritten text
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued session access token.

  parameters:
    PersonId:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:

    PersonState:
      type: string
      enum: [growing, keeping, returning, archive]

    HookKind:
      type: string
      enum: [durable, routine, context, recent, time_bound]

    ThreadStatus:
      type: string
      enum: [open, attempted, resolved, lapsed]

    ThreadKind:
      type: string
      enum: [plan_shaped, commitment_theirs, commitment_mine, time_bound]

    CaptureProcessingStatus:
      type: string
      enum: [pending_transcription, pending_extraction, extracted, failed]

    RelationshipType:
      type: string
      enum: [friend, family, colleague, acquaintance, mentor, peer]

    Person:
      type: object
      required: [id, fullName, personState]
      properties:
        id: { type: string }
        personState:
          $ref: '#/components/schemas/PersonState'
        fullName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        contactInfo: { type: string, nullable: true }
        hasContactInfo: { type: boolean }
        relationship: { $ref: '#/components/schemas/RelationshipType', nullable: true }
        whereWeMet: { type: string, nullable: true }
        whenWeMet: { type: string, format: date-time, nullable: true }
        context:
          type: object
          additionalProperties: true
          description: Flexible non-normalized facts (location, work, family, availability, etc.)
        hooks:
          type: array
          items: { $ref: '#/components/schemas/Hook' }
        openThreads:
          type: array
          items: { $ref: '#/components/schemas/OpenThread' }
        isFavorite: { type: boolean }

    Hook:
      type: object
      required: [id, content, kind]
      properties:
        id: { type: string }
        content: { type: string }
        kind: { $ref: '#/components/schemas/HookKind' }
        lastUsedAt: { type: string, format: date-time, nullable: true }

    OpenThread:
      type: object
      required: [id, content, status, kind]
      properties:
        id: { type: string }
        content: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/ThreadStatus' }
        kind: { $ref: '#/components/schemas/ThreadKind' }

    CreateThreadRequest:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        dueDate: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/ThreadKind' }

    CreatePersonRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string }
        contactInfo: { type: string, nullable: true }
        relationship: { $ref: '#/components/schemas/RelationshipType', nullable: true }
        whereWeMet: { type: string }
        whenWeMet: { type: string, format: date-time }
        context:
          type: object
          additionalProperties: true

    UpdatePersonRequest:
      type: object
      properties:
        personState: { $ref: '#/components/schemas/PersonState' }
        fullName: { type: string }
        contactInfo: { type: string, nullable: true }
        relationship: { $ref: '#/components/schemas/RelationshipType', nullable: true }
        whereWeMet: { type: string }
        whenWeMet: { type: string, format: date-time }
        context:
          type: object
          additionalProperties: true
        isFavorite: { type: boolean }

    Self:
      type: object
      required: [id, fullName, relationshipGoals, createdAt]
      properties:
        id: { type: string }
        fullName: { type: string }
        ageRange: { type: string, nullable: true }
        occupationIndustry: { type: string, nullable: true }
        interestsHobbies:
          type: array
          items: { type: string }
        socialActivities:
          type: array
          items: { type: string }
        relationshipGoals:
          type: array
          items: { type: string }
          minItems: 1
        commPreferences:
          type: array
          items: { type: string }
        weeklyRoutine: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    UpdateSelfRequest:
      type: object
      properties:
        fullName: { type: string }
        ageRange: { type: string }
        occupationIndustry: { type: string }
        interestsHobbies:
          type: array
          items: { type: string }
        socialActivities:
          type: array
          items: { type: string }
        relationshipGoals:
          type: array
          items: { type: string }
        commPreferences:
          type: array
          items: { type: string }
        weeklyRoutine: { type: string }

    CreateTextCaptureRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        contactIds:
          type: array
          items: { type: string }

    CreateVoiceCaptureRequest:
      type: object
      required: [audioStoragePath]
      properties:
        audioStoragePath:
          type: string
          description: 'e.g. "{userId}/{captureId}.webm"'
        contactIds:
          type: array
          items: { type: string }

    CaptureStatus:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/CaptureProcessingStatus' }

    CaptureSummary:
      type: object
      required: [id, transcript, createdAt]
      properties:
        id: { type: string }
        transcript: { type: string }
        createdAt: { type: string, format: date-time }

    CaptureDetail:
      allOf:
        - $ref: '#/components/schemas/CaptureStatus'
        - type: object
          properties:
            transcript: { type: string, nullable: true }
            extraction:
              $ref: '#/components/schemas/CaptureExtractionOutput'
              nullable: true
            ruminationFeedback: { type: string, nullable: true }

    SuggestedAction:
      type: object
      required: [id, personId, goal, actionType, expiresAt]
      properties:
        id: { type: string }
        personId: { type: string }
        goal: { type: string }
        actionType: { type: string, enum: [message, non_message] }
        draft: { type: string, nullable: true }
        nonMessageAction:
          type: object
          nullable: true
          additionalProperties: true
        hookRef: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }

    CreateExperimentRequest:
      type: object
      required: [personId, prediction]
      properties:
        personId: { type: string }
        prediction: { type: string }

    Experiment:
      type: object
      required: [id, personId, prediction, createdAt]
      properties:
        id: { type: string }
        personId: { type: string }
        prediction: { type: string }
        outcome: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    
    ExtractedHookEntry:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        kind: { $ref: '#/components/schemas/HookKind' }

    ExtractedThreadEntry:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        kind: { $ref: '#/components/schemas/ThreadKind' }

    Candidate:
      type: object
      required: [personId, displayName, personState, hooks, threads]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        personState: { $ref: '#/components/schemas/PersonState' }
        upcomingPlan: { type: object, nullable: true, description: Details of a known upcoming plan, if any. }
        latestCapture: { type: object, nullable: true, description: Details of recent inbound activity. }
        stalenessHint: { type: string, nullable: true }
        hooks:
          type: array
          items: { $ref: '#/components/schemas/ExtractedHookEntry' }
        threads:
          type: array
          items: { $ref: '#/components/schemas/ExtractedThreadEntry' }
        history:
          type: object
          required: [allowedGoals]
          properties:
            allowedGoals:
              type: array
              items: { type: string, enum: [check_in, make_plan] }
          description: Nudge history summary including allowed_goals.
        nonMessageKind: { type: string, nullable: true, description: Advisory field indicating an available or recent non-message action. }

    DecisionEngineInput:
      type: object
      required: [asOf, inputSnapshotId, trigger, user, budget, candidates]
      properties:
        asOf: { type: string, format: date-time, description: Frozen Clock. Exact time the snapshot was created. }
        inputSnapshotId: { type: string, format: uuid, description: Unique ID for this snapshot version. }
        trigger:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [scheduled, input_triggered] }
            personId: { type: string, format: uuid, nullable: true }
            capturesCompletedAt: { type: string, format: date-time, nullable: true }
          description: Details the trigger.
        user:
          type: object
          required: [timezone]
          properties:
            timezone: { type: string, description: IANA timezone format. }
            routines: { type: object, description: Placeholder for user routines object. }
          description: Contains user preferences.
        budget:
          type: object
          required: [cardsRemaining, pushAvailable]
          properties:
            cardsRemaining: { type: integer }
            pushAvailable: { type: boolean }
          description: Contains cards_remaining and push_available status.
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
          description: Array of eligible contacts.

    DecisionEngineOutput:
      type: object
      required: [decision, inputSnapshotId, rationale]
      properties:
        decision: { type: string, enum: [action, none] }
        inputSnapshotId: { type: string, format: uuid }
        personId: { type: string, format: uuid, nullable: true }
        actionType: { type: string, enum: [message, non_message], nullable: true }
        goal: { type: string, enum: [check_in, make_plan], nullable: true }
        hookRef: { type: string, format: uuid, nullable: true }
        draft: { type: string, nullable: true }
        nonMessageAction: { type: object, nullable: true, description: Structured instruction for a non-message action (e.g., get contacts info). }
        rationale: { type: string, description: Trace-only text describing the LLM's reasoning. }

    CaptureExtractionOutput:
      type: object
      properties:
        personName: { type: string }
        contactInfo: { type: string, nullable: true }
        newHooks:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ExtractedHookEntry' }
        newThreads:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ExtractedThreadEntry' }
        context:
          type: object
          additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }