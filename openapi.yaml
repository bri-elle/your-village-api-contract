openapi: 3.0.3

info:
  title: YourVillage API
  version: 1.0.0
  description: |
    MVP API contract for YourVillage, synchronized with the Data Design Specification (DDD) 
    and Product Brief. Features strict active-set limits, granular contact info tracking, 
    rumination extraction support, and CBT behavioral experiment logging.

servers:
  - url: https://api.example.com
    description: Production

tags:
  - name: Auth
  - name: People
  - name: Me
  - name: Memos
  - name: Memories
  - name: Reminders
  - name: AI
  - name: Suggestions

security:
  - bearerAuth: []

paths:

  # ----------------------------------------
  # AUTH
  # ----------------------------------------

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Request a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset request accepted

  # ----------------------------------------
  # PEOPLE
  # ----------------------------------------

  /people:
    get:
      tags: [People]
      summary: List people
      parameters:
        - name: q
          in: query
          required: false
          description: Search people by name
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by contact status (active, archive)
          schema:
            $ref: '#/components/schemas/ContactStatus'
        - name: activeTrack
          in: query
          required: false
          description: Filter by tracking state (keeping, growing)
          schema:
            $ref: '#/components/schemas/ContactTrack'
      responses:
        '200':
          description: List of people
          content:
            application/json:
              schema:
                type: object
                required: [items, activeCount]
                properties:
                  activeCount:
                    type: integer
                    description: Current number of active contacts (capped at 15-25)
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Person'

    post:
      tags: [People]
      summary: Create a person
      description: Enforces active set capacity rules; adding past limits requires archiving an existing active contact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Bad request or active set cap exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /people/{id}:
    get:
      tags: [People]
      summary: Get a person
      parameters:
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: Person details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [People]
      summary: Update a person
      parameters:
        - $ref: '#/components/parameters/PersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [People]
      summary: Delete a person
      description: Deletes person and cascades deletion to hooks, open threads, nudge states, and captures per DDD.
      parameters:
        - $ref: '#/components/parameters/PersonId'
      responses:
        '204':
          description: Person deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /people/{id}/memories:
    get:
      tags: [Memories]
      summary: List memories for a person
      parameters:
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: Memories belonging to the person
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Memory'

    post:
      tags: [Memories]
      summary: Add a memory to a person's profile
      parameters:
        - $ref: '#/components/parameters/PersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemoryRequest'
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'

  # ----------------------------------------
  # ME
  # ----------------------------------------

  /me:
    get:
      tags: [Me]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'

    patch:
      tags: [Me]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelfRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'

  /me/memories:
    get:
      tags: [Memories]
      summary: List current user's memories
      responses:
        '200':
          description: User memories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Memory'

    post:
      tags: [Memories]
      summary: Add a personal memory/journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemoryRequest'
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'

  # ----------------------------------------
  # MEMOS (Raw Capture Pipeline Inputs)
  # ----------------------------------------

  /memos/text:
    post:
      tags: [Memos]
      summary: Submit a raw text memo
      description: Submits text input to trigger asynchronous entity extraction and rumination analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTextMemoRequest'
      responses:
        '202':
          description: Text memo accepted for extraction processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoProcessingResponse'

  /memos/voice:
    post:
      tags: [Memos]
      summary: Upload a voice memo
      description: Uploads an audio recording for transcription, extraction, and rumination parsing. Audio is deleted post-transcription.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Voice recording buffer
      responses:
        '202':
          description: Voice memo accepted into capture pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoProcessingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ----------------------------------------
  # REMINDERS
  # ----------------------------------------

  /reminders:
    post:
      tags: [Reminders]
      summary: Create a reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReminderRequest'
      responses:
        '201':
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'

  # ----------------------------------------
  # AI
  # ----------------------------------------

  /ai/rewrite:
    post:
      tags: [AI]
      summary: Rewrite text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewriteRequest'
      responses:
        '200':
          description: Rewritten text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewriteResponse'

  /ai/extract-entities:
    post:
      tags: [AI]
      summary: Extract useful details from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractEntitiesRequest'
      responses:
        '200':
          description: Extracted entities conforming to CaptureExtractionOutput
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureExtractionOutput'

  # ----------------------------------------
  # SUGGESTIONS / HOME
  # ----------------------------------------

  /suggestions:
    get:
      tags: [Suggestions]
      summary: Get today's suggested actions
      responses:
        '200':
          description: Today's suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/SuggestedAction'

  /suggestions/{id}/dismiss:
    post:
      tags: [Suggestions]
      summary: Dismiss a suggestion
      description: Guilt-free dismissal that logs quiet period constraints without penalties.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Suggestion dismissed

  /suggestions/{id}/override:
    post:
      tags: [Suggestions]
      summary: Override the suggested goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal:
                  type: string
      responses:
        '204':
          description: Goal override recorded

  # ----------------------------------------
  # EXPERIMENTS (Behavioral Layer / CBT)
  # ----------------------------------------

  /experiments:
    post:
      tags: [Suggestions]
      summary: Record a behavioral experiment prediction and outcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BehavioralExperiment'
      responses:
        '201':
          description: Experiment recorded successfully


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PersonId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/Self'

    ContactStatus:
      type: string
      enum: [active, archive]

    ContactTrack:
      type: string
      enum: [keeping, growing]

    HookType:
      type: string
      enum: [general, reconnection]

    ThreadStatus:
      type: string
      enum: [pending, completed, failed]

    Person:
      type: object
      required: [id, name, status, activeTrack, hasContactInfo, isFavorite]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/ContactStatus'
        activeTrack:
          $ref: '#/components/schemas/ContactTrack'
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        contactInfo:
          type: string
          nullable: true
          description: Phone number or handle. Nullable at capture and flagged aggressively.
        hasContactInfo:
          type: boolean
          description: Explicit flag indicating whether usable contact info is present.
        howWeMet:
          type: string
        whereWeMet:
          type: string
        whenWeMet:
          type: string
          format: date-time
        vibe:
          type: string
        logistics:
          type: object
          additionalProperties: true
        hooks:
          type: array
          items:
            $ref: '#/components/schemas/Hook'
        openThreads:
          type: array
          items:
            $ref: '#/components/schemas/OpenThread'
        isFavorite:
          type: boolean

    Hook:
      type: object
      required: [id, content, type]
      properties:
        id:
          type: string
        content:
          type: string
        type:
          $ref: '#/components/schemas/HookType'
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    OpenThread:
      type: object
      required: [id, content, status]
      properties:
        id:
          type: string
        content:
          type: string
        dueDate:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/ThreadStatus'

    CreatePersonRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        contactInfo:
          type: string
          nullable: true
        howWeMet:
          type: string
        whereWeMet:
          type: string
        whenWeMet:
          type: string
          format: date-time
        vibe:
          type: string
        logistics:
          type: object
          additionalProperties: true

    UpdatePersonRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ContactStatus'
        activeTrack:
          $ref: '#/components/schemas/ContactTrack'
        name:
          type: string
        contactInfo:
          type: string
          nullable: true
        howWeMet:
          type: string
        whereWeMet:
          type: string
        whenWeMet:
          type: string
          format: date-time
        vibe:
          type: string
        logistics:
          type: object
          additionalProperties: true
        isFavorite:
          type: boolean

    Self:
      type: object
      required: [id, full_name, weeklyRoutine, created_at]
      properties:
        id:
          type: string
        full_name:
          type: string
        weeklyRoutine:
          type: string
        created_at:
          type: string
          format: date-time

    UpdateSelfRequest:
      type: object
      properties:
        full_name:
          type: string
        weeklyRoutine:
          type: string

    CaptureExtractionOutput:
      type: object
      required: [personName, vibe, newHooks, newThreads]
      properties:
        personName:
          type: string
        contactInfo:
          type: string
          nullable: true
        vibe:
          type: string
        ruminationFeedback:
          type: string
          nullable: true
          description: Extracted self-critical reflections handled separately by the CBT rumination catch.
        newHooks:
          type: array
          items:
            type: object
            required: [content, type]
            properties:
              content:
                type: string
              type:
                $ref: '#/components/schemas/HookType'
        newThreads:
          type: array
          items:
            type: object
            required: [content]
            properties:
              content:
                type: string
              dueDate:
                type: string
                format: date-time
        logistics:
          type: object
          additionalProperties: true

    Memory:
      type: object
      required: [id, content, createdAt]
      properties:
        id:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateMemoryRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    CreateTextMemoRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    MemoProcessingResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending_transcription, pending_extraction, extracted, failed]
        ruminationFeedback:
          type: string
          nullable: true

    Reminder:
      type: object
      required: [id, contactId, content, status]
      properties:
        id:
          type: string
        contactId:
          type: string
        content:
          type: string
        dueDate:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ThreadStatus'

    CreateReminderRequest:
      type: object
      required: [contactId, content]
      properties:
        contactId:
          type: string
        content:
          type: string
        dueDate:
          type: string
          format: date-time

    RewriteRequest:
      type: object
      required: [content, mode]
      properties:
        content:
          type: string
        mode:
          type: string
          enum: [concise, grammar]

    RewriteResponse:
      type: object
      required: [content]
      properties:
        content:
          type: string

    ExtractEntitiesRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    SuggestedAction:
      type: object
      required: [id, contactId, goal, draft, expiresAt]
      properties:
        id:
          type: string
        contactId:
          type: string
        goal:
          type: string
        draft:
          type: string
        hookRef:
          type: string
        confidence:
          type: number
        expiresAt:
          type: string
          format: date-time

    BehavioralExperiment:
      type: object
      required: [contactId, prediction]
      properties:
        contactId:
          type: string
        prediction:
          type: string
          description: User's prediction of what will happen before reaching out.
        outcome:
          type: string
          nullable: true
          description: What actually happened after the interaction.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'