openapi: 3.0.3

info:
  title: YourVillage API
  version: 1.0.0
  description: >-
    API contract for YourVillage, drafted directly from the Data Design
    Specification (DDS). Authentication is handled client-side by the
    Supabase Auth SDK — this contract has no auth endpoints. Every
    endpoint derives the calling user from the authenticated session;

servers:
  - url: /api
    description: Next.js API base path

tags:
  - name: Me
  - name: People
  - name: Threads
  - name: Captures
  - name: Suggestions
  - name: Experiments

security:
  - bearerAuth: []

paths:
  # ----------------------------------------
  # ME (profiles)
  # ----------------------------------------

  /me:
    get:
      tags: [Me]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'

    patch:
      tags: [Me]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelfRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'

  # ----------------------------------------
  # PEOPLE (contacts)
  # ----------------------------------------

  /people:
    get:
      tags: [People]
      summary: List people
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Search by name
        - name: relationshipState
          in: query
          schema:
            $ref: '#/components/schemas/RelationshipState'
          description: >-
            Filter by state. "returning" surfaces reconnection candidates —
            no separate reconnection endpoint exists, it's this filter.
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: List of people
          content:
            application/json:
              schema:
                type: object
                required: [items, activeCount]
                properties:
                  activeCount:
                    type: integer
                    description: Count of contacts in growing/keeping states.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Person'

    post:
      tags: [People]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'

  /people/{id}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [People]
      summary: Get a person
      responses:
        '200':
          description: Person details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [People]
      summary: Update a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [People]
      summary: Delete a person
      description: >-
        Cascades to hooks, threads, and nudge state for this person. The
        database unlinks this person's ID from captures.contact_ids while
        retaining capture records in the user's account history.
      responses:
        '204':
          description: Person deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /people/{id}/captures:
    parameters:
      - $ref: '#/components/parameters/PersonId'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
    get:
      tags: [Captures]
      summary: List raw capture history for a person
      description: Audit trail of transcripts/text memos linked to this person.
      responses:
        '200':
          description: Captures linked to this person
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaptureSummary'

  /people/{id}/threads:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    post:
      tags: [Threads]
      summary: Create a thread (commitment/follow-up)
      description: >-
        Covers both AI-extracted commitments and user-set reminders — a
        reminder is a thread with kind "commitment_mine".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenThread'

  /people/{personId}/threads/{threadId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema: { type: string }
      - name: threadId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Threads]
      summary: Update a thread's status
      description: >-
        Resolving a thread (e.g. "did it happen? yes") is how a reported
        real-world interaction is logged — this is what should drive
        relationship_state transitions (growing → keeping), not any in-app
        action like copying a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ThreadStatus'
      responses:
        '200':
          description: Thread updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenThread'

  # ----------------------------------------
  # CAPTURES (raw input pipeline)
  # ----------------------------------------

  /captures/text:
    post:
      tags: [Captures]
      summary: Submit a text memo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTextCaptureRequest'
      responses:
        '202':
          description: Accepted for extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'

  /captures/voice:
    post:
      tags: [Captures]
      summary: Register a voice memo for transcription
      description: >-
        The frontend uploads the audio directly to a private Supabase
        Storage bucket (RLS-scoped to the authenticated user) and submits
        only the resulting path. The API never receives raw audio bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoiceCaptureRequest'
      responses:
        '202':
          description: Accepted for transcription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'

  /captures/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Captures]
      summary: Get capture status, transcript, and extraction result
      responses:
        '200':
          description: Current capture state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Captures]
      summary: Submit reviewed transcript and target contact(s) to trigger extraction
      description: >-
        Called after the user reviews/edits the transcript. Extraction
        runs on this approved text, not the raw transcription output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript]
              properties:
                transcript:
                  type: string
                contactIds:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: >-
                    Existing contact IDs. Omit this field to let extraction
                    propose a new contact for manual approval.
      responses:
        '202':
          description: Accepted for extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'

  # ----------------------------------------
  # SUGGESTIONS (nudges)
  # ----------------------------------------

  /suggestions:
    get:
      tags: [Suggestions]
      summary: Get today's suggested actions
      responses:
        '200':
          description: Current suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/SuggestedAction'

  /suggestions/{id}/act:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Suggestions]
      summary: Mark a suggestion as acted on (e.g. draft copied/shared)
      description: >-
        Updates nudge status only. Does not by itself change relationship_state —
        only a resolved thread (reported real-world interaction) does that.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedAction'

  /suggestions/{id}/dismiss:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Suggestions]
      summary: Dismiss a suggestion ("Not now")
      responses:
        '204':
          description: Dismissed

  /suggestions/{id}/override:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Suggestions]
      summary: Override the suggested goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal: { type: string }
      responses:
        '204':
          description: Override recorded

  # ----------------------------------------
  # EXPERIMENTS (behavioral layer)
  # ----------------------------------------

  /experiments:
    post:
      tags: [Experiments]
      summary: Log a prediction before a hard reach-out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'

  /experiments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Experiments]
      summary: Log the outcome of a prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued session access token.
  parameters:
    PersonId:
      name: id
      in: path
      required: true
      schema: { type: string }

    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
      description: Number of items to return.

    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Offset for pagination.

  schemas:
    RelationshipState:
      type: string
      enum: [growing, keeping, returning, archive]

    HookKind:
      type: string
      enum: [durable, routine, context, recent, time_bound]

    ThreadStatus:
      type: string
      enum: [open, attempted, resolved, lapsed]

    ThreadKind:
      type: string
      enum: [plan_shaped, commitment_theirs, commitment_mine, time_bound]

    CaptureProcessingStatus:
      type: string
      enum: [pending_transcription, pending_review, pending_extraction, extracted, failed]
      description: >-
        Voice captures progress from pending_transcription to pending_review
        once a transcript is available, then to pending_extraction after the
        user submits the reviewed transcript. Text captures enter
        pending_extraction directly. Both flows end extracted or failed.

    RelationshipType:
      type: string
      enum: [friend, family, colleague, acquaintance, mentor, peer, partner]

    Person:
      type: object
      required: [id, fullName, relationshipState, hooks, openThreads]
      properties:
        id: { type: string }
        relationshipState:
          $ref: '#/components/schemas/RelationshipState'
        fullName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        isFavorite:
          { type: boolean, description: Favorite flag for contact prioritization/filtering. }
        birthday:
          {
            type: string,
            format: date,
            nullable: true,
            description: Contact birthday (YYYY-MM-DD).,
          }
        memories:
          type: array
          items: { type: string }
          nullable: true
          description: Image gallery URLs for memories.
        relationship: { $ref: '#/components/schemas/RelationshipType', nullable: true }
        whereWeMet: { type: string, nullable: true }
        whenWeMet: { type: string, format: date-time, nullable: true }
        lastInteraction:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Timestamp of the last interaction with this contact. Crucial for tracking relationship activity and powering Story 3 (Returning).,
          }
        context:
          type: object
          additionalProperties: true
          description: Structured JSON containing personal facts (e.g., corgi names, shared memories, location, work, family, availability) for personalized messaging.
        hooks:
          type: array
          items: { $ref: '#/components/schemas/Hook' }
        openThreads:
          type: array
          items: { $ref: '#/components/schemas/OpenThread' }

    Hook:
      type: object
      required: [id, content, kind]
      properties:
        id: { type: string }
        content: { type: string }
        kind: { $ref: '#/components/schemas/HookKind' }
        captureId:
          { type: string, format: uuid, nullable: true, description: Source capture for this fact. }
        lastUsedAt: { type: string, format: date-time, nullable: true }

    OpenThread:
      type: object
      required: [id, content, status, kind]
      properties:
        id: { type: string }
        content: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/ThreadStatus' }
        kind: { $ref: '#/components/schemas/ThreadKind' }
        captureId:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Source capture for this commitment.,
          }

    CreateThreadRequest:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        kind: { $ref: '#/components/schemas/ThreadKind' }

    CreatePersonRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string }
        relationship: { $ref: '#/components/schemas/RelationshipType', nullable: true }
        isFavorite: { type: boolean, nullable: true }
        birthday: { type: string, format: date, nullable: true }
        memories:
          type: array
          items: { type: string }
          nullable: true
          description: Image gallery URLs for memories.
        whereWeMet: { type: string }
        whenWeMet: { type: string, format: date-time }
        lastInteraction:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Timestamp of the last interaction with this contact.,
          }
        context:
          type: object
          additionalProperties: true
          description: Structured JSON containing personal facts (e.g., corgi names, shared memories, location, work, family, availability) for personalized messaging.

    UpdatePersonRequest:
      type: object
      properties:
        relationshipState: { $ref: '#/components/schemas/RelationshipState' }
        fullName: { type: string }
        relationship: { $ref: '#/components/schemas/RelationshipType', nullable: true }
        isFavorite: { type: boolean, nullable: true }
        birthday: { type: string, format: date, nullable: true }
        memories:
          type: array
          items: { type: string }
          nullable: true
          description: Image gallery URLs for memories.
        whereWeMet: { type: string }
        whenWeMet: { type: string, format: date-time }
        lastInteraction:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Timestamp of the last interaction with this contact.,
          }
        context:
          type: object
          additionalProperties: true
          description: Structured JSON containing personal facts (e.g., corgi names, shared memories, location, work, family, availability) for personalized messaging.

    Self:
      type: object
      required: [id, fullName, relationshipGoals, createdAt]
      properties:
        id: { type: string }
        fullName: { type: string }
        age:
          {
            type: integer,
            nullable: true,
            description: Stores the precise age from the User Profile Data.,
          }
        location:
          {
            type: string,
            nullable: true,
            description: Stores the current location from the User Profile Data.,
          }
        notes:
          {
            type: string,
            nullable: true,
            description: Stores general user notes not covered by other fields.,
          }
        occupationIndustry: { type: string, nullable: true }
        interestsHobbies:
          type: array
          items: { type: string }
        socialActivities:
          type: array
          items: { type: string }
        relationshipGoals:
          type: array
          items: { type: string }
          minItems: 1
        commPreferences:
          type: array
          items: { type: string }
        weeklyRoutine: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    UpdateSelfRequest:
      type: object
      properties:
        fullName: { type: string }
        age:
          {
            type: integer,
            nullable: true,
            description: Stores the precise age from the User Profile Data.,
          }
        location:
          {
            type: string,
            nullable: true,
            description: Stores the current location from the User Profile Data.,
          }
        notes:
          {
            type: string,
            nullable: true,
            description: Stores general user notes not covered by other fields.,
          }
        occupationIndustry: { type: string }
        interestsHobbies:
          type: array
          items: { type: string }
        socialActivities:
          type: array
          items: { type: string }
        relationshipGoals:
          type: array
          items: { type: string }
        commPreferences:
          type: array
          items: { type: string }
        weeklyRoutine: { type: string }

    CreateTextCaptureRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        contactIds:
          type: array
          items: { type: string }
        followUp:
          type: object
          nullable: true
          description: Structured trigger logic (e.g., target date, conditions, status) required for proactive suggestions in Stories 1 and 2.

    CreateVoiceCaptureRequest:
      type: object
      required: [audioStoragePath]
      properties:
        audioStoragePath:
          type: string
          description: 'e.g. "{userId}/{captureId}.webm"'
        contactIds:
          type: array
          items: { type: string }
        followUp:
          type: object
          nullable: true
          description: Structured trigger logic (e.g., target date, conditions, status) required for proactive suggestions in Stories 1 and 2.

    CaptureStatus:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/CaptureProcessingStatus' }

    CaptureSummary:
      type: object
      required: [id, transcript, createdAt]
      properties:
        id: { type: string }
        transcript: { type: string }
        followUp:
          type: object
          nullable: true
          description: Structured trigger logic (e.g., target date, conditions, status) required for proactive suggestions.
        createdAt: { type: string, format: date-time }

    CaptureDetail:
      allOf:
        - $ref: '#/components/schemas/CaptureStatus'
        - type: object
          properties:
            transcript: { type: string, nullable: true }
            extraction:
              $ref: '#/components/schemas/CaptureExtractionOutput'
              nullable: true
            followUp:
              type: object
              nullable: true
              description: >-
                Structured trigger logic (e.g., target date, conditions, status)
                required for reliable execution of proactive suggestions in Stories 1 and 2.
              properties:
                targetDate: { type: string, format: date-time, nullable: true }
                conditions: { type: string, nullable: true }
                status: { type: string, nullable: true }
              additionalProperties: true
            ruminationFeedback: { type: string, nullable: true }
            failure:
              $ref: '#/components/schemas/CaptureFailure'
              nullable: true

    CaptureFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      description: Stable failure details when a capture status is failed.
      properties:
        code: { type: string, description: Stable machine-readable error code. }
        message: { type: string, description: User-facing explanation. }
        retryable: { type: boolean, description: Whether retrying the capture can succeed. }

    CaptureExtractionOutput:
      type: object
      required: [personName, newHooks, newThreads, context]
      properties:
        personName: { type: string }
        newHooks:
          type: array
          items: { $ref: '#/components/schemas/ExtractedHookEntry' }
        newThreads:
          type: array
          items: { $ref: '#/components/schemas/ExtractedThreadEntry' }
        context:
          type: object
          additionalProperties: true
          description: Extensible contact facts; actionable commitments remain threads.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    SuggestedAction:
      oneOf:
        - $ref: '#/components/schemas/MessageSuggestedAction'
        - $ref: '#/components/schemas/NonMessageSuggestedAction'
      discriminator:
        propertyName: actionType
        mapping:
          message: '#/components/schemas/MessageSuggestedAction'
          non_message: '#/components/schemas/NonMessageSuggestedAction'

    MessageSuggestedAction:
      type: object
      additionalProperties: false
      required: [id, personId, goal, actionType, inputSnapshotId, draft, expiresAt]
      properties:
        id: { type: string }
        personId: { type: string }
        goal: { type: string, enum: [check_in, make_plan] }
        actionType: { type: string, enum: [message] }
        inputSnapshotId:
          { type: string, description: Immutable decision snapshot that produced this suggestion. }
        draft: { type: string }
        hookRef: { type: string, nullable: true }
        threadRef: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }

    NonMessageSuggestedAction:
      type: object
      additionalProperties: false
      required: [id, personId, goal, actionType, inputSnapshotId, nonMessageAction, expiresAt]
      properties:
        id: { type: string }
        personId: { type: string }
        goal: { type: string, enum: [check_in, make_plan] }
        actionType: { type: string, enum: [non_message] }
        inputSnapshotId:
          { type: string, description: Immutable decision snapshot that produced this suggestion. }
        nonMessageAction:
          $ref: '#/components/schemas/NonMessageAction'
        hookRef: { type: string, nullable: true }
        threadRef: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }

    NonMessageAction:
      type: object
      additionalProperties: false
      required: [kind, label, payload]
      properties:
        kind: { type: string }
        label: { type: string }
        payload: { type: object, additionalProperties: true }

    CreateExperimentRequest:
      type: object
      required: [personId, prediction]
      properties:
        personId: { type: string }
        prediction: { type: string }

    Experiment:
      type: object
      required: [id, personId, prediction, createdAt]
      properties:
        id: { type: string }
        personId: { type: string }
        prediction: { type: string }
        outcome: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ExtractedHookEntry:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        kind: { $ref: '#/components/schemas/HookKind' }

    ExtractedThreadEntry:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        kind: { $ref: '#/components/schemas/ThreadKind' }

    Candidate:
      type: object
      required: [personId, displayName, relationshipState, hooks, threads]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        relationshipState: { $ref: '#/components/schemas/RelationshipState' }
        lastInteraction:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Timestamp of the last reported interaction. Powers Story 3 (Returning) and quiet period logic.,
          }
        upcomingPlan:
          { type: object, nullable: true, description: Details of a known upcoming plan, if any. }
        latestCapture:
          { type: object, nullable: true, description: Details of recent inbound activity. }
        stalenessHint: { type: string, nullable: true }
        hooks:
          type: array
          items: { $ref: '#/components/schemas/ExtractedHookEntry' }
        threads:
          type: array
          items: { $ref: '#/components/schemas/ExtractedThreadEntry' }
        history:
          type: object
          required: [allowedGoals]
          properties:
            allowedGoals:
              type: array
              items: { type: string, enum: [check_in, make_plan] }
          description: Nudge history summary including allowed_goals.
        nonMessageKind:
          {
            type: string,
            nullable: true,
            description: Advisory field indicating an available or recent non-message action.,
          }

    DecisionEngineInput:
      type: object
      required: [asOf, inputSnapshotId, trigger, user, budget, candidates]
      properties:
        asOf:
          {
            type: string,
            format: date-time,
            description: Frozen Clock. Exact time the snapshot was created.,
          }
        inputSnapshotId: { type: string, description: Unique ID for this snapshot version. }
        trigger:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [scheduled, input_triggered, manual_request] }
            personId: { type: string, format: uuid, nullable: true }
            capturesCompletedAt: { type: string, format: date-time, nullable: true }
          description: Details the trigger.
        user:
          type: object
          required: [timezone]
          properties:
            timezone: { type: string, description: IANA timezone format. }
            routines: { type: object, description: Placeholder for user routines object. }
          description: Contains user preferences.
        budget:
          type: object
          required: [cardsRemaining, pushAvailable]
          properties:
            cardsRemaining: { type: integer }
            pushAvailable: { type: boolean }
          description: Contains cards_remaining and push_available status.
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
          description: Array of eligible contacts.

    DecisionEngineOutput:
      oneOf:
        - $ref: '#/components/schemas/NoDecisionOutput'
        - $ref: '#/components/schemas/MessageDecisionOutput'
        - $ref: '#/components/schemas/NonMessageDecisionOutput'

    NoDecisionOutput:
      type: object
      additionalProperties: false
      required: [decision, inputSnapshotId, rationale]
      properties:
        decision: { type: string, enum: [none] }
        inputSnapshotId: { type: string }
        rationale: { type: string, description: Trace-only decision rationale. }

    MessageDecisionOutput:
      type: object
      additionalProperties: false
      required: [decision, inputSnapshotId, personId, actionType, goal, draft, rationale]
      properties:
        decision: { type: string, enum: [action] }
        inputSnapshotId: { type: string }
        personId: { type: string }
        actionType: { type: string, enum: [message] }
        goal: { type: string, enum: [check_in, make_plan] }
        hookRef: { type: string, nullable: true }
        draft: { type: string }
        rationale: { type: string, description: Trace-only decision rationale. }

    NonMessageDecisionOutput:
      type: object
      additionalProperties: false
      required: [decision, inputSnapshotId, personId, actionType, goal, nonMessageAction, rationale]
      properties:
        decision: { type: string, enum: [action] }
        inputSnapshotId: { type: string }
        personId: { type: string }
        actionType: { type: string, enum: [non_message] }
        goal: { type: string, enum: [check_in, make_plan] }
        nonMessageAction: { $ref: '#/components/schemas/NonMessageAction' }
        rationale: { type: string, description: Trace-only decision rationale. }

    PythonDecisionCandidate:
      description: >-
        Private Python decision-engine candidate. This schema is not an HTTP
        payload or endpoint; the boundary maps public personId,
        relationshipState, openThreads, and nonMessageAction to person_id,
        relationship_state, open_threads, and non_message_action.
      type: object
      required:
        - person_id
        - display_name
        - relationship_state
        - hooks
        - open_threads
      properties:
        person_id: { type: string }
        display_name: { type: string }
        profile:
          $ref: '#/components/schemas/PythonDecisionCandidateProfile'
        relationship_state:
          $ref: '#/components/schemas/RelationshipState'
        state_since: { type: string, format: date-time, nullable: true }
        captured_at: { type: string, format: date-time, nullable: true }
        last_reported_interaction_at: { type: string, format: date-time, nullable: true }
        last_interaction: { type: string, format: date-time, nullable: true }
        reported_interaction_count: { type: integer, minimum: 0, default: 0 }
        upcoming_plan: { type: object, nullable: true, additionalProperties: true }
        inbound: { type: object, nullable: true, additionalProperties: true }
        staleness_hint: { type: string, nullable: true }
        hooks:
          type: array
          items: { $ref: '#/components/schemas/PythonDecisionHook' }
        open_threads:
          type: array
          items: { $ref: '#/components/schemas/PythonDecisionOpenThread' }
        history:
          $ref: '#/components/schemas/PythonDecisionCandidateHistory'
        non_message_kind: { type: string, nullable: true }
        transcript_excerpts:
          type: array
          items: { type: string }
          description: Data-minimized/redacted snippets only; raw transcripts are never included.

    PythonDecisionCandidateProfile:
      type: object
      properties:
        how_we_met: { type: string, nullable: true }
        logistics: { type: string, nullable: true }
        contact_info_present: { type: boolean, default: true }

    PythonDecisionHook:
      type: object
      required: [hook_id, text, kind, captured_at]
      properties:
        hook_id: { type: string }
        text: { type: string }
        kind: { type: string }
        captured_at: { type: string, format: date-time }
        used_at: { type: string, format: date-time, nullable: true }

    PythonDecisionOpenThread:
      type: object
      required: [thread_id, text, kind, state, opened_at]
      properties:
        thread_id: { type: string }
        text: { type: string }
        kind: { type: string }
        state: { $ref: '#/components/schemas/ThreadStatus' }
        opened_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time, nullable: true }
        last_attempted_at: { type: string, format: date-time, nullable: true }

    PythonDecisionCandidateHistory:
      type: object
      properties:
        nudges:
          type: array
          items: { type: object, additionalProperties: true }
        omitted:
          type: object
          properties:
            count: { type: integer, minimum: 0 }
            oldest_at: { type: string, format: date-time, nullable: true }
          additionalProperties: true
        last_action_at: { type: string, format: date-time, nullable: true }
        quiet_until: { type: string, format: date-time, nullable: true }
        allowed_goals:
          type: array
          items: { type: string, enum: [check_in, make_plan] }

    PythonDecisionEngineInput:
      description: >-
        Private Python decision-engine snapshot, not an HTTP payload or
        endpoint. The boundary maps asOf to as_of, inputSnapshotId to
        input_snapshot_id, trigger.type to trigger.kind, personId to
        person_id, capturesCompletedAt to capture_completed_at, and
        cardsRemaining to cards_remaining.
      type: object
      required: [as_of, input_snapshot_id, trigger, user, budget, candidates]
      properties:
        as_of:
          {
            type: string,
            format: date-time,
            description: Frozen Clock. Exact time the snapshot was created.,
          }
        input_snapshot_id: { type: string, description: Unique ID for this snapshot version. }
        trigger:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [scheduled, input_triggered, manual_request] }
            person_id: { type: string, nullable: true }
            capture_completed_at: { type: string, format: date-time, nullable: true }
          description: Details the trigger.
        user:
          type: object
          required: [timezone]
          properties:
            timezone: { type: string, description: IANA timezone format. }
            routines:
              description: User routines supplied by the App data adapter.
              oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  items: { type: object, additionalProperties: true }
            moved_at: { type: string, format: date, nullable: true }
          additionalProperties: true
          description: Contains user preferences.
        budget:
          type: object
          required: [cards_remaining, push_available]
          properties:
            cards_remaining: { type: integer, minimum: 0, maximum: 3 }
            push_available: { type: boolean }
        user_text_input:
          type: string
          default: ''
          description: Current user text used for interaction analysis.
        candidates:
          type: array
          items: { $ref: '#/components/schemas/PythonDecisionCandidate' }
          description: Array of eligible contacts.

    PythonDecisionEngineOutput:
      description: >-
        Private Python decision-engine result, not an HTTP payload or
        endpoint. The boundary maps input_snapshot_id, person_id, action_type,
        hook_ref, and non_message_action to their camelCase public forms.
      type: object
      additionalProperties: false
      required:
        - decision
        - input_snapshot_id
        - person_id
        - action_type
        - goal
        - hook_ref
        - draft
        - non_message_action
        - rationale
      properties:
        decision: { type: string, enum: [action, none] }
        input_snapshot_id: { type: string }
        person_id: { type: string, nullable: true }
        action_type: { type: string, enum: [message, non_message], nullable: true }
        goal: { type: string, enum: [check_in, make_plan], nullable: true }
        hook_ref: { type: string, nullable: true }
        draft: { type: string, nullable: true }
        non_message_action:
          type: object
          nullable: true
          additionalProperties: false
          required: [kind, instruction]
          properties:
            kind: { type: string }
            instruction: { type: string }
        rationale: { type: string, description: Trace-only decision explanation. }

    DecisionEngineHealth:
      type: object
      required: [status, model]
      properties:
        status: { type: string, enum: [ok] }
        model:
          type: string
          description: Gemini model configured for this DE service instance.

    SupabaseDecisionRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: Owner profile ID used to scope all database reads and writes.
        capture_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Extracted capture that triggers an input-triggered decision. Omit
            for scheduled or manual requests.
        trigger_kind:
          type: string
          enum: [scheduled, input_triggered, manual_request]
          nullable: true
          description: >-
            Defaults to input_triggered when capture_id is supplied and to
            scheduled otherwise.
        as_of:
          type: string
          format: date-time
          nullable: true
          description: Optional frozen clock; defaults to the current UTC time.
        cards_remaining:
          type: integer
          minimum: 0
          maximum: 3
          nullable: true
          description: Optional daily card budget; defaults to 3.
        push_available:
          type: boolean
          nullable: true
          description: >-
            Optional push availability; defaults to false for input-triggered
            runs and true otherwise.

    SupabaseDecisionResult:
      type: object
      required:
        - input
        - output
        - interaction_analysis
        - state_updates
        - excluded
        - nudge_id
      properties:
        input:
          $ref: '#/components/schemas/PythonDecisionEngineInput'
        output:
          $ref: '#/components/schemas/PythonDecisionEngineOutput'
        interaction_analysis:
          $ref: '#/components/schemas/InteractionAnalysisResult'
        state_updates:
          type: array
          items: { $ref: '#/components/schemas/DecisionStateUpdate' }
        excluded:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: Candidate IDs mapped to deterministic exclusion reasons.
        nudge_id:
          type: string
          format: uuid
          nullable: true
          description: Persisted nudge ID, or null when no message action was stored.

    InteractionAnalysisResult:
      type: object
      required:
        - person_id
        - real_world
        - reciprocal
        - substantive
        - kind
        - thread_ref
        - thread_transition
        - rationale
      properties:
        person_id: { type: string, nullable: true }
        real_world: { type: boolean }
        reciprocal: { type: boolean }
        substantive: { type: boolean }
        kind: { type: string }
        thread_ref: { type: string, nullable: true }
        thread_transition:
          type: string
          enum: [attempted, resolved, lapsed]
          nullable: true
        rationale: { type: string }

    DecisionFeedbackRequest:
      type: object
      required: [input_snapshot_id, person_id, feedback, at]
      properties:
        input_snapshot_id: { type: string }
        person_id: { type: string }
        nudge_id: { type: string, nullable: true }
        feedback: { type: string, enum: [skipped, acted, superseded] }
        at: { type: string, format: date-time }
        user_text_input:
          type: string
          default: ''
          description: >-
            Interaction text used when acted or superseded feedback is
            reanalyzed. It is ignored for skipped feedback.

    SupabaseDecisionFeedbackRequest:
      allOf:
        - $ref: '#/components/schemas/DecisionFeedbackRequest'
        - type: object
          required: [user_id, nudge_id]
          properties:
            user_id:
              type: string
              format: uuid
              description: Owner profile ID used to authorize database access.
            nudge_id:
              type: string
              format: uuid
              description: Persisted suggestion receiving this feedback.

    DecisionFeedbackResult:
      type: object
      required:
        - input_snapshot_id
        - person_id
        - feedback
        - nudge_id
        - state_updates
        - candidate
      properties:
        input_snapshot_id: { type: string }
        person_id: { type: string }
        feedback: { type: string, enum: [skipped, acted, superseded] }
        nudge_id: { type: string }
        state_updates:
          type: array
          items: { $ref: '#/components/schemas/DecisionStateUpdate' }
        candidate:
          $ref: '#/components/schemas/PythonDecisionCandidate'

    DecisionStateView:
      type: object
      required: [input_snapshot_id, state_updates, candidates]
      properties:
        input_snapshot_id: { type: string }
        state_updates:
          type: array
          items: { $ref: '#/components/schemas/DecisionStateUpdate' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/PythonDecisionCandidate' }

    DecisionStateUpdate:
      oneOf:
        - $ref: '#/components/schemas/PersonStateUpdate'
        - $ref: '#/components/schemas/OpenThreadStateUpdate'
      discriminator:
        propertyName: entity
        mapping:
          person: '#/components/schemas/PersonStateUpdate'
          open_thread: '#/components/schemas/OpenThreadStateUpdate'

    PersonStateUpdate:
      type: object
      additionalProperties: false
      required: [entity, person_id, relationship_state]
      properties:
        entity: { type: string, enum: [person] }
        person_id: { type: string }
        relationship_state: { $ref: '#/components/schemas/RelationshipState' }

    OpenThreadStateUpdate:
      type: object
      additionalProperties: false
      required: [entity, thread_id, status]
      properties:
        entity: { type: string, enum: [open_thread] }
        thread_id: { type: string }
        status: { $ref: '#/components/schemas/ThreadStatus' }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
